name: Build and deploy Docker image

on:
  push:
    branches:
      - main
    paths:
      - server/**
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the existing latest image without rebuilding it
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy-image:
    runs-on: ubuntu-latest

    steps:
      # Always needed: the deploy step reads server/portal.toml
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker buildx
        if: ${{ !inputs.deploy_only }}
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        if: ${{ !inputs.deploy_only }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: ${{ !inputs.deploy_only }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        if: ${{ !inputs.deploy_only }}
        uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        uses: jason0x43/portal-cli@v0.2.0
        with:
          config: server/portal.toml
          # deploy_only redeploys whatever latest currently points to
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.deploy_only && 'latest' || format('sha-{0}', github.sha) }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          known-hosts: ${{ secrets.DEPLOY_HOST_KEY }}
